name: Worker tick

# Keeps the app's worker ticking around the clock by calling /api/cron/tick. The app answers each
# tick with when to call next (nextTickInSeconds, see lib/workerCadence.ts): every ~30s while emails
# are going out, at the next scheduled send otherwise, and at most every 15 minutes (an hour at the
# weekend) when there's nothing to send — so the free-plan database can sleep between ticks
# instead of being kept awake all month.
#
# Why it's built as a chain rather than a schedule: GitHub's scheduler is best-effort and skips
# triggers without retrying. Measured Sept 12-15, each 55-minute run was followed by 1-5 HOURS with
# no run at all — the worker was only up about a third of the time, so scheduled emails sat unsent
# until someone ran it by hand.
#
# So each run now queues the next run itself, as its very first step (workflow_dispatch via the
# GitHub API — one of the events GitHub allows the built-in token to trigger). The concurrency
# group lets exactly one run work while one waits: the moment a run finishes — or crashes, or
# times out — the waiting run starts, and it immediately queues the one after it. Coverage no
# longer depends on the scheduler at all. Each run lasts ~5h40m, just inside GitHub's 6-hour job
# limit, so handovers are rare.
#
# The schedule stays as a backstop that restarts the chain if it's ever broken (e.g. someone
# cancels the waiting run, or the repo's Actions were paused). The app also has its own backstop:
# while anyone has it open, it runs a tick itself when this worker has been silent (see
# app/api/notifications/route.ts).
#
# Safe to overlap: /api/cron/tick claims each row atomically before sending (see
# lib/scheduler.ts claimScheduledAction), so two ticks can never send the same email twice.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write # queue the next run of this workflow
  contents: read

concurrency:
  group: outreach-worker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are capped at 6 hours; the loop below stops itself at 5h40m.
    timeout-minutes: 355
    steps:
      - name: Queue the next run so coverage never gaps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /tmp/dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/worker-cron.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}' || echo "000")
          if [ "$status" = "204" ]; then
            echo "Next run queued."
          else
            # Not fatal: the schedule above still restarts the chain.
            echo "Couldn't queue the next run (HTTP $status):"
            cat /tmp/dispatch.json 2>/dev/null || true
          fi

      - name: Tick the worker for ~5h40m, as often as the app asks
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -u
          END=$(( $(date +%s) + 340*60 ))
          fails=0
          ticks=0
          while [ "$(date +%s)" -lt "$END" ]; do
            started=$(date +%s)
            status=$(curl -s -m 90 -o /tmp/tick.json -w "%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}/api/cron/tick" || echo "000")
            ticks=$((ticks+1))

            if [ "$status" = "200" ]; then
              fails=0
              # Only surface ticks that actually did something, so the log stays readable.
              if ! grep -q '"initialEmailsSent":0,"actionsProcessed":0' /tmp/tick.json 2>/dev/null; then
                echo "[$(date -u +%H:%M:%S)] $(cat /tmp/tick.json)"
              fi
            else
              fails=$((fails+1))
              echo "[$(date -u +%H:%M:%S)] tick failed (HTTP $status), consecutive failures: $fails"
              cat /tmp/tick.json 2>/dev/null || true
              # A deploy restart or cold start recovers on its own. Only if the app is persistently
              # unreachable does this run end — the queued run then takes over and tries fresh.
              if [ "$fails" -ge 20 ]; then
                echo "20 consecutive failures — ending so the queued run can start clean."
                exit 1
              fi
            fi

            # Wait as long as the app asked (30s-1h), counted from when this tick started. A failed
            # tick or an older deploy that doesn't say falls back to the old 30s cadence.
            # "|| true": GitHub runs this with pipefail, and a response without the field must not end the run.
            wait_for=$(grep -o '"nextTickInSeconds":[0-9]*' /tmp/tick.json 2>/dev/null | head -n1 | cut -d: -f2 || true)
            [ "$status" = "200" ] || wait_for=30
            [ -n "${wait_for:-}" ] || wait_for=30
            [ "$wait_for" -lt 30 ] && wait_for=30
            [ "$wait_for" -gt 3600 ] && wait_for=3600
            elapsed=$(( $(date +%s) - started ))
            sleep_for=$(( wait_for - elapsed ))
            # Don't sleep past this run's end — the queued run takes over from there.
            remaining=$(( END - $(date +%s) ))
            [ "$sleep_for" -gt "$remaining" ] && sleep_for=$remaining
            [ "$sleep_for" -gt 0 ] && sleep "$sleep_for"
          done
          echo "Completed $ticks ticks; handing over to the queued run."
